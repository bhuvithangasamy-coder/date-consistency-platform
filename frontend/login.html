<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Date Consistency Validation Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f172a 0%, #070d1e 100%);
      padding: 1rem;
    }
    .login-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #1e293b;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 26rem;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 0.375rem;
    }
    .form-input {
      width: 100%;
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 0.625rem 0.875rem;
      color: #ffffff;
      font-size: 0.875rem;
      outline: none;
    }
    .form-input:focus {
      border-color: #0284c7;
    }
    .demo-pill {
      padding: 0.375rem;
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 0.5rem;
      color: #38bdf8;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }
    .demo-pill:hover {
      background: #1e293b;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="width: 3.5rem; height: 3.5rem; background: linear-gradient(135deg, #0284c7, #14b8a6); border-radius: 1rem; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Date Consistency Platform</h2>
        <p style="font-size: 0.75rem; color: #38bdf8; font-weight: 500;">Clinical Quality Engine</p>
      </div>

      <div id="error-msg" style="display: none; padding: 0.75rem; background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); border-radius: 0.75rem; color: #fb7185; font-size: 0.75rem; margin-bottom: 1rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" value="analyst" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" value="analyst123" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <span style="font-size: 0.625rem; color: #64748b; font-weight: bold; text-transform: uppercase;">Demo Credentials (Click to autofill)</span>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.375rem;">
            <div class="demo-pill" onclick="setLogin('admin', 'admin123')">Admin</div>
            <div class="demo-pill" onclick="setLogin('analyst', 'analyst123')">Analyst</div>
            <div class="demo-pill" onclick="setLogin('viewer', 'viewer123')">Viewer</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
          Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function setLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const errBox = document.getElementById('error-msg');
      errBox.style.display = 'none';

      try {
        const res = await api.login(u, p);
        if (res.access_token) {
          localStorage.setItem('token', res.access_token);
          localStorage.setItem('user', JSON.stringify(res));
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errBox.innerText = err.message || 'Login failed. Please check credentials.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
