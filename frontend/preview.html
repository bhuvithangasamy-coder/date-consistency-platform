<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Preview | Date Consistency Validation Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
          <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Data Preview & Schema Inspector</h2>
          <p style="font-size: 0.75rem; color: #94a3b8;">Inspect raw clinical dataset records and timestamp columns</p>
        </div>

        <div style="display: flex; gap: 0.5rem; align-items: center; background: #0f172a; padding: 0.375rem 0.75rem; border-radius: 0.75rem; border: 1px solid #1e293b; font-size: 0.75rem;">
          <span style="color: #94a3b8;">Select Table:</span>
          <select id="table-select" style="background: transparent; color: #fff; border: none; font-weight: bold; cursor: pointer;" onchange="changeTable(this.value)">
            <option value="admissions" selected>admissions.csv</option>
            <option value="patients">patients.csv</option>
            <option value="transfers">transfers.csv</option>
            <option value="labevents">labevents.csv</option>
            <option value="prescriptions">prescriptions.csv</option>
            <option value="icustays">icustays.csv</option>
            <option value="chartevents">chartevents.csv</option>
          </select>
        </div>
      </div>

      <div class="card" style="overflow-x: auto;" id="table-container">
        <div style="text-align: center; color: #94a3b8; padding: 2rem;">Loading data preview...</div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadPreview(tableName = 'admissions') {
      const container = document.getElementById('table-container');
      try {
        const data = await api.previewTable(1, tableName, 50);
        if (!data || !data.columns) return;

        let headersHtml = data.columns.map(c => `<th style="${c.includes('time') || c.includes('date') ? 'color: #14b8a6; background: rgba(20,184,166,0.1);' : ''}">${c}</th>`).join('');
        let rowsHtml = data.records.map(row => `
          <tr>
            ${data.columns.map(col => `<td style="${col.includes('time') || col.includes('date') ? 'color: #38bdf8; font-weight: bold;' : ''}">${row[col] ?? ''}</td>`).join('')}
          </tr>
        `).join('');

        container.innerHTML = `
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.75rem;">
            <span style="color: #38bdf8; font-weight: bold; font-family: monospace;">Table: ${tableName}.csv (${data.columns.length} columns)</span>
            <span style="color: #64748b; font-family: monospace;">Showing first 50 records</span>
          </div>
          <table class="data-table">
            <thead><tr>${headersHtml}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
      } catch (err) {
        container.innerHTML = `<div style="color: #fb7185;">Error loading preview: ${err.message}</div>`;
      }
    }

    function changeTable(tbl) {
      loadPreview(tbl);
    }

    document.addEventListener('DOMContentLoaded', () => loadPreview('admissions'));
  </script>
</body>
</html>
