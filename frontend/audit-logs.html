<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | Date Consistency Validation Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
          <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Audit Logs & System Operations</h2>
          <p style="font-size: 0.75rem; color: #94a3b8;">Immutable log trail of data validation runs, user actions, and system modifications</p>
        </div>
      </div>

      <div class="card" style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Timestamp</th>
              <th>User</th>
              <th>Action</th>
              <th>Entity Type</th>
              <th>Entity ID</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="audit-tbody">
            <tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 2rem;">Loading audit logs...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadAuditLogs() {
      const tbody = document.getElementById('audit-tbody');
      try {
        const logs = await api.getAuditLogs(50);
        if (!logs || logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 2rem;">No audit logs recorded yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td style="color: #64748b;">#${l.id}</td>
            <td style="font-family: monospace; color: #14b8a6;">${new Date(l.timestamp).toLocaleString()}</td>
            <td><strong style="color: #fff;">${l.username}</strong></td>
            <td><span style="color: #38bdf8; font-weight: bold;">${l.action}</span></td>
            <td><span style="background: #0b1329; padding: 0.25rem 0.5rem; border-radius: 0.375rem; border: 1px solid #1e293b; color: #cbd5e1;">${l.entity_type}</span></td>
            <td style="font-family: monospace; color: #64748b;">${l.entity_id || 'N/A'}</td>
            <td style="color: #94a3b8; font-size: 0.6875rem;">${l.details || ''}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color: #fb7185; padding: 1rem;">Error loading audit logs: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAuditLogs);
  </script>
</body>
</html>
