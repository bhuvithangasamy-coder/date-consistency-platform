version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: date_platform_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: date_validation_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: date_platform_backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: date_validation_db
      SECRET_KEY: production-secret-key-change-me
    ports:
      - "8000:8000"

volumes:
  mysql_data:
